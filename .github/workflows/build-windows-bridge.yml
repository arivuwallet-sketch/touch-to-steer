name: Build Windows Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touch-to-steer-windows-bridge
  cancel-in-progress: true

jobs:
  build-windows-bridge:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official ViGEmBus installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public/bridge/drivers | Out-Null
          Invoke-WebRequest -Uri "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe" -OutFile "public/bridge/drivers/ViGEmBus_1.22.0_x64_x86_arm64.exe"

      - name: Install bridge dependencies
        working-directory: public/bridge
        run: npm install --omit=dev

      - name: Verify CMake
        shell: pwsh
        run: |
          cmake --version

      - name: Build native Windows mouse injector
        shell: pwsh
        run: |
          cmake -S public/bridge/native -B public/bridge/native/build -G "Visual Studio 17 2022" -A x64
          cmake --build public/bridge/native/build --config Release --target mouse-injector
          if ($LASTEXITCODE -ne 0) {
            throw "CMake mouse-injector target failed with exit code $LASTEXITCODE."
          }

          cmake --build public/bridge/native/build --config Release --target game-audio-haptics --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake audio-haptics target failed. Native build directory:"
            Get-ChildItem "public/bridge/native/build" -Force -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
            throw "CMake game-audio-haptics target failed with exit code $LASTEXITCODE."
          }

          $mouseExe = Get-ChildItem "public/bridge/native/build" -Filter "mouse-injector.exe" -File -Recurse | Select-Object -First 1
          $audioExe = Get-ChildItem "public/bridge/native/build" -Filter "game-audio-haptics.exe" -File -Recurse | Select-Object -First 1

          if (-not $mouseExe) {
            throw "mouse-injector.exe was not produced by the CMake target."
          }
          if (-not $audioExe) {
            Write-Host "CMake build tree:"
            Get-ChildItem "public/bridge/native/build" -Force -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
            throw "game-audio-haptics.exe was not produced by the CMake target."
          }

          Copy-Item $mouseExe.FullName "public/bridge/native/mouse-injector.exe" -Force
          Copy-Item $audioExe.FullName "public/bridge/native/game-audio-haptics.exe" -Force

      - name: Verify native haptic helpers
        shell: pwsh
        run: |
          if (-not (Test-Path "public/bridge/native/mouse-injector.exe")) {
            throw "mouse-injector.exe was not created."
          }
          if (-not (Test-Path "public/bridge/native/game-audio-haptics.exe")) {
            throw "game-audio-haptics.exe was not created."
          }

      - name: Validate bridge JavaScript
        shell: pwsh
        run: |
          node --check public/bridge/rig-bridge.js

      - name: Verify controller reports and asynchronous foreground detection
        run: node --test tests/controller-report.test.cjs tests/foreground-game.test.cjs

      - name: Verify Windows XInput diagnostic interop
        shell: pwsh
        run: ./public/bridge/windows/Test-Controller.ps1 -ListOnly

      - name: Package bridge as a Windows executable
        working-directory: public/bridge
        run: npm run build:exe

      - name: Runtime-smoke-test packaged executable
        shell: pwsh
        run: |
          $log = "public/bridge/dist/bridge-smoke.log"
          $errlog = "public/bridge/dist/bridge-smoke.err"
          $env:TOUCHTOSTEER_SKIP_DRIVER_INSTALL = "1"
          $process = Start-Process -FilePath "public/bridge/dist/TouchToSteer-Bridge.exe" -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $errlog
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            Write-Host "Bridge exited during startup with code $($process.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path $errlog) { Get-Content $errlog }
            throw "Packaged bridge exited during runtime smoke test."
          }
          $stdout = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          $stderr = if (Test-Path $errlog) { Get-Content $errlog -Raw } else { "" }
          $output = $stdout + [Environment]::NewLine + $stderr

          if ($output -notmatch "TouchToSteer Bridge ready\.") {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $errlog -ErrorAction SilentlyContinue
            throw "Packaged bridge did not report readiness."
          }

          # The packaged bridge writes its native-addon diagnostics to the
          # persistent log before console startup output is emitted.
          $bridgeLogPath = Join-Path $env:TEMP "TouchToSteer\bridge.log"
          $bridgeLog = if (Test-Path $bridgeLogPath) { Get-Content $bridgeLogPath -Raw } else { "" }
          if ($bridgeLog -notmatch "ViGEm native addon loaded") {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $errlog -ErrorAction SilentlyContinue
            Get-Content $bridgeLogPath -ErrorAction SilentlyContinue
            throw "Packaged bridge could not load the ViGEm native addon."
          }

          # GitHub-hosted Windows runners do not have the ViGEmBus kernel
          # driver installed. VIGEM_ERROR_BUS_NOT_FOUND is therefore an
          # expected CI result; the local user machine will supply the driver.
          if ($output -notmatch "ViGEm unavailable - running in echo-only mode" -and $output -notmatch "Virtual .*Xbox 360.*target added") {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $errlog -ErrorAction SilentlyContinue
            throw "Packaged bridge did not initialize ViGEm cleanly."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged bridge runtime smoke test passed."
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "public/bridge/dist/TouchToSteer-Bridge.exe")) {
            throw "TouchToSteer-Bridge.exe was not created."
          }
          $size = (Get-Item "public/bridge/dist/TouchToSteer-Bridge.exe").Length
          if ($size -lt 1000000) {
            throw "Packaged bridge is unexpectedly small: $size bytes."
          }
          Write-Host "Packaged bridge size: $size bytes"

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "public/bridge/dist/TouchToSteer-Bridge.exe" "release/TouchToSteer-Bridge.exe"
          Copy-Item "public/bridge/windows/README.md" "release/README.md"
          Copy-Item "public/bridge/windows/INPUT-CHECK.md" "release/INPUT-CHECK.md"
          Copy-Item "public/bridge/windows/Test-Controller.ps1" "release/Test-Controller.ps1"
          Compress-Archive -Path "release/TouchToSteer-Bridge.exe", "release/README.md", "release/INPUT-CHECK.md", "release/Test-Controller.ps1" -DestinationPath "public/bridge/dist/TouchToSteer-Bridge-Windows.zip" -Force

      - name: Build TouchToSteer Windows desktop package
        shell: pwsh
        run: |
          if (Test-Path "desktop-release") {
            Remove-Item "desktop-release" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "desktop-release" | Out-Null

          # Nativefier's CLI takes the destination as a positional argument
          # after the target URL. Keep the destination explicit so the package
          # is created inside desktop-release on Windows runners.
          npx --yes nativefier@52.0.0 --name "TouchToSteer — Spectral Control System" --platform windows --arch x64 --electron-version 25.7.0 --width 1280 --height 800 --icon "public/favicon.ico" --overwrite "https://touch-to-steer.lovable.app/" "desktop-release"

          Write-Host "Nativefier output:"
          Get-ChildItem "desktop-release" -Force | Format-Table -AutoSize | Out-String | Write-Host

          $app = Get-ChildItem "desktop-release" -Directory -Recurse |
            Where-Object { $_.Name -like "*-win32-x64" } |
            Select-Object -First 1

          if (-not $app) {
            Write-Host "Recursive desktop-release contents:"
            Get-ChildItem "desktop-release" -Force -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
            throw "Nativefier Windows package directory was not created."
          }

          Write-Host "Nativefier package directory: $($app.FullName)"

          $zipPath = "desktop-release/TouchToSteer — Spectral Control System-win32-x64.zip"
          Compress-Archive -Path "$($app.FullName)/*" -DestinationPath $zipPath -Force

          if (-not (Test-Path $zipPath)) {
            throw "Windows desktop zip was not created."
          }

          $zipSize = (Get-Item $zipPath).Length
          if ($zipSize -lt 10000000) {
            throw "Windows desktop zip is unexpectedly small: $zipSize bytes."
          }

          Write-Host "Windows desktop package: $zipSize bytes"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchToSteer-Windows
          path: |
            public/bridge/dist/TouchToSteer-Bridge.exe
            public/bridge/dist/TouchToSteer-Bridge-Windows.zip
            desktop-release/TouchToSteer — Spectral Control System-win32-x64.zip
          retention-days: 90

      - name: Publish stable latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bridge-latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create bridge-latest \
            "public/bridge/dist/TouchToSteer-Bridge-Windows.zip" \
            "public/bridge/dist/TouchToSteer-Bridge.exe" \
            "desktop-release/TouchToSteer — Spectral Control System-win32-x64.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "TouchToSteer Windows Bridge (latest)" \
            --notes "Portable Windows bridge built from commit ${GITHUB_SHA}. No Node.js, npm, Git Bash, Visual Studio, or C++ build tools are required on the target PC. The package contains the TouchToSteer bridge and the official ViGEmBus installer used for first-run driver setup."
