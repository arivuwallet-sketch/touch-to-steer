name: Build Windows Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-bridge:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official ViGEmBus installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public/bridge/drivers | Out-Null
          Invoke-WebRequest -Uri "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe" -OutFile "public/bridge/drivers/ViGEmBus_1.22.0_x64_x86_arm64.exe"

      - name: Install bridge dependencies
        working-directory: public/bridge
        run: npm install --omit=dev

      - name: Verify CMake and Visual Studio generator
        shell: pwsh
        run: |
          $vsPath = & "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ build tools were not found on the runner." }
          Write-Host "Visual Studio: $vsPath"
          cmake --version
          cmake --help | Select-String "Visual Studio 18 2026"

      - name: Build native Windows mouse injector
        shell: pwsh
        run: |
          cmake -S public/bridge/native -B public/bridge/native/build -G "Visual Studio 18 2026" -A x64
          cmake --build public/bridge/native/build --config Release
          Copy-Item "public/bridge/native/build/Release/mouse-injector.exe" "public/bridge/native/mouse-injector.exe"

      - name: Verify native mouse injector
        shell: pwsh
        run: |
          if (-not (Test-Path "public/bridge/native/mouse-injector.exe")) {
            throw "mouse-injector.exe was not created."
          }

      - name: Package bridge as a Windows executable
        working-directory: public/bridge
        run: npm run build:exe

      - name: Runtime-smoke-test packaged executable
        shell: pwsh
        run: |
          $log = "public/bridge/dist/bridge-smoke.log"
          $errlog = "public/bridge/dist/bridge-smoke.err"
          $env:TOUCHTOSTEER_SKIP_DRIVER_INSTALL = "1"
          $process = Start-Process -FilePath "public/bridge/dist/TouchToSteer-Bridge.exe" -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $errlog
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            Write-Host "Bridge exited during startup with code $($process.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path $errlog) { Get-Content $errlog }
            throw "Packaged bridge exited during runtime smoke test."
          }
          $output = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if ($output -notmatch "TouchToSteer Bridge ready\.") {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $errlog -ErrorAction SilentlyContinue
            throw "Packaged bridge did not report readiness."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged bridge runtime smoke test passed."
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "public/bridge/dist/TouchToSteer-Bridge.exe")) {
            throw "TouchToSteer-Bridge.exe was not created."
          }
          $size = (Get-Item "public/bridge/dist/TouchToSteer-Bridge.exe").Length
          if ($size -lt 1000000) {
            throw "Packaged bridge is unexpectedly small: $size bytes."
          }
          Write-Host "Packaged bridge size: $size bytes"

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "public/bridge/dist/TouchToSteer-Bridge.exe" "release/TouchToSteer-Bridge.exe"
          Copy-Item "public/bridge/windows/README.md" "release/README.md"
          Compress-Archive -Path "release/TouchToSteer-Bridge.exe", "release/README.md" -DestinationPath "public/bridge/dist/TouchToSteer-Bridge-Windows.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchToSteer-Bridge-Windows
          path: |
            public/bridge/dist/TouchToSteer-Bridge.exe
            public/bridge/dist/TouchToSteer-Bridge-Windows.zip
          retention-days: 90

      - name: Publish stable latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bridge-latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create bridge-latest \
            "public/bridge/dist/TouchToSteer-Bridge-Windows.zip" \
            "public/bridge/dist/TouchToSteer-Bridge.exe" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "TouchToSteer Windows Bridge (latest)" \
            --notes "Portable Windows bridge built from commit ${GITHUB_SHA}. No Node.js, npm, Git Bash, Visual Studio, or C++ build tools are required on the target PC. The package contains the TouchToSteer bridge and the official ViGEmBus installer used for first-run driver setup."
