name: Build Flutter Android APK

on:
  push:
    branches:
      - flutter-native-android-2026
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Prepare Android SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Flutter dependencies
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: flutter pub get

      - name: Write local.properties
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          printf 'sdk.dir=%s
flutter.sdk=%s
' "$ANDROID_SDK_ROOT" "$FLUTTER_ROOT" > android/local.properties

      - name: Build release APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk || test -s android/app/build/outputs/apk/release/app-release.apk
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            sha256sum build/app/outputs/flutter-apk/app-release.apk
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            sha256sum android/app/build/outputs/apk/release/app-release.apk
            ls -lh android/app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: touch-to-steer-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
